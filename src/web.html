<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khom · Entregas</title>
<style>body{font:16px system-ui;background:#f5f3ee;color:#242823;max-width:960px;margin:50px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:42px;letter-spacing:-2px}p{line-height:1.5;color:#596157}input,button{font:inherit;border:1px solid #bcc2b6;border-radius:8px;padding:12px}button{background:#2d4c38;color:white;cursor:pointer}article{background:white;border:1px solid #d7dbd1;border-radius:12px;padding:24px;margin:16px 0}small{color:#5a6458}pre{white-space:pre-wrap;overflow-wrap:anywhere}#auth{display:flex;gap:12px;flex-wrap:wrap}input{flex:1}button:disabled{opacity:.5}</style>
<header><h1>khom<span style="color:#628768">.</span></h1><small>CODEX · DELIVERY HARNESS</small></header><p>Objetivos, evidencia y decisiones pendientes.</p><div id="auth"><input id="token" type="password" autocomplete="off" aria-label="Token de acceso" placeholder="Token de acceso"><button id="connect">Ver ejecuciones</button></div><p id="message" role="status">Base de desarrollo. El dispatcher remoto todavía requiere integración.</p><main id="runs"></main>
<script type="module">
const $=id=>document.getElementById(id);async function api(path,method='GET'){const r=await fetch('/api/'+path,{method,headers:{Authorization:'Bearer '+$('token').value}});if(!r.ok)throw Error('No se pudo completar la solicitud ('+r.status+')');return r.json();}
async function refresh(){try{const runs=await api('runs');$('runs').replaceChildren();$('message').textContent=runs.length?'Estado persistido de las ejecuciones.':'No hay ejecuciones. Creá y autorizá un contrato desde Codex o la API.';for(const run of runs){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=run.contract.goal;article.append(title);const status=document.createElement('p');status.textContent=run.state+' · '+run.attempts.length+' intentos';article.append(status);const reason=document.createElement('p');reason.textContent=run.reason??'Esperando un worker configurado';article.append(reason);if(['queued','running','waiting_external'].includes(run.state)){const stop=document.createElement('button');stop.textContent='Detener';stop.onclick=async()=>{try{await api('runs/'+run.id+'/stop','POST');await refresh();}catch(e){$('message').textContent=e.message;}};article.append(stop);}const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Contrato y evidencia';const pre=document.createElement('pre');pre.textContent=JSON.stringify(run,null,2);details.append(summary,pre);article.append(details);$('runs').append(article);}}catch(e){$('message').textContent=e.message;}}
$('connect').onclick=refresh;
</script></html>
